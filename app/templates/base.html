<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ config.SITE_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/marketplace.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include "partials/_header.html" %}
  <main id="main" class="{% block main_class %}container page{% endblock %}" tabindex="-1">
    {% block flash %}{% include "partials/_flash.html" %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  {% include "partials/_footer.html" %}
  <script src="{{ url_for('static', filename='js/marketplace.js') }}" defer></script>
</body>
</html>
