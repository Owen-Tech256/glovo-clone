{% extends 'base.html' %}{% block title %}Create promotion · {{ config.SITE_NAME }}{% endblock %}{% block content %}<section class="form-panel"><h1>Create promotion draft</h1><p class="muted">Saving a draft does not charge you or publish the promotion.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Promotion title</label><input id="title" name="title" required maxlength="140"><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="2000"></textarea><label for="budget_ugx">Planned budget (UGX)</label><input id="budget_ugx" name="budget_ugx" type="number" min="0" value="0" required><button class="button">Save draft</button></form></section>{% endblock %}
