{% extends 'base.html' %}{% block title %}Add product · {{ config.SITE_NAME }}{% endblock %}{% block content %}<section class="form-panel"><h1>Add a product</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Product name</label><input id="name" name="name" required maxlength="180"><label for="category">Category</label><input id="category" name="category" required maxlength="60"><label for="price_ugx">Price (UGX)</label><input id="price_ugx" name="price_ugx" type="number" min="0" step="1" required><label for="stock_quantity">Stock quantity</label><input id="stock_quantity" name="stock_quantity" type="number" min="0" step="1" required><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="2000"></textarea><button class="button">Save product</button></form></section>{% endblock %}
